
events {
    worker_connections 1024;
}

http {
    # Resolver DNS interno de Docker
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    # Balanceo entre las tres réplicas
    upstream taller_backend {
        zone taller_backend 64k;

        server app1:8080 resolve max_fails=1 fail_timeout=5s;
        server app2:8080 resolve max_fails=1 fail_timeout=5s;
        server app3:8080 resolve max_fails=1 fail_timeout=5s;
    }

    # =========================================
    # HTTP - PUERTO 80
    # =========================================
    server {
        listen 80;
        server_name localhost 127.0.0.1;

        location / {
            proxy_pass http://taller_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 1s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }

    # =========================================
    # HTTPS - PUERTO 443
    # =========================================
    server {
        listen 443 ssl;
        server_name localhost 127.0.0.1;

        ssl_certificate /etc/nginx/certs/localhost.pem;
        ssl_certificate_key /etc/nginx/certs/localhost-key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        location / {
            proxy_pass http://taller_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 1s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}

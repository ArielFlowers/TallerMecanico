
events {
    worker_connections 1024;
}

http {
    # DNS interno de Docker
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;

    upstream taller_backend {
        # Memoria compartida para actualizar replicas
        zone taller_backend 64k;

        # Descubrimiento dinamico de replicas
        server app1:8080 resolve max_fails=1 fail_timeout=5s;
        server app2:8080 resolve max_fails=1 fail_timeout=5s;
        server app3:8080 resolve max_fails=1 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://taller_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Limitar espera al conectar con una replica
            proxy_connect_timeout 1s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;

            # Reintentar con otra replica ante fallos
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
        }
    }
}

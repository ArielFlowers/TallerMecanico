
# ============================================
# H1 - AUTO TALLER PRO
# DOCKER + NGINX + 3 REPLICAS + HTTPS
# H2 - REDIS COMO CACHE DISTRIBUIDA
# ============================================

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile

  image: taller-mecanico:h1

  environment:
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_URLS: http://+:8080

    ConnectionStrings__MySqlConnection: "Server=mysql;Port=3306;Database=taller_mecanico;User ID=taller;Password=${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD en .env};"

    DataProtection__KeysPath: /app/shared-keys

    # H2: las 3 replicas comparten la misma instancia de Redis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    Redis__ExpiracionDashboardSegundos: 60

  volumes:
    - taller-dpkeys:/app/shared-keys

  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy

  restart: unless-stopped

# ============================================
# SERVICIOS
# ============================================

services:

  # ------------------------------------------
  # MYSQL
  # ------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: taller-mecanico-mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: taller_mecanico
      MYSQL_USER: taller
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD en .env}

    ports:
      - "127.0.0.1:3307:3306"

    command: --log-bin-trust-function-creators=1

    volumes:
      - taller-mysql-data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
      interval: 10s
      timeout: 5s
      retries: 15

    restart: unless-stopped

  # ------------------------------------------
  # REDIS - CACHE DISTRIBUIDA (H2)
  # ------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: taller-mecanico-redis

    # Cache volatil: sin persistencia en disco y con limite de memoria.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru

    ports:
      - "127.0.0.1:6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

  # ------------------------------------------
  # REPLICA 1
  # ------------------------------------------
  app1:
    <<: *app-common

    ports:
      - "127.0.0.1:5000:8080"

  # ------------------------------------------
  # REPLICA 2
  # ------------------------------------------
  app2:
    <<: *app-common

    ports:
      - "127.0.0.1:5001:8080"

  # ------------------------------------------
  # REPLICA 3
  # ------------------------------------------
  app3:
    <<: *app-common

    ports:
      - "127.0.0.1:5002:8080"

  # ------------------------------------------
  # NGINX - BALANCEADOR HTTP / HTTPS
  # ------------------------------------------
  nginx:
    image: nginx:1.27-alpine

    ports:
      # HTTP principal
      - "127.0.0.1:80:80"

      # HTTP alternativo para pruebas
      - "127.0.0.1:8088:80"

      # HTTPS
      - "127.0.0.1:443:443"

    volumes:
      # Configuracion de Nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

      # Certificados HTTPS locales
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      - app1
      - app2
      - app3

    restart: unless-stopped

# ============================================
# VOLUMENES PERSISTENTES
# ============================================

volumes:
  taller-mysql-data:
  taller-dpkeys:

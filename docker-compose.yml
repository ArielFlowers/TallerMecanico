
# ============================================
# H1 - AUTO TALLER PRO
# DOCKER + NGINX + 3 REPLICAS + HTTPS
# H2 - REDIS COMO CACHE DISTRIBUIDA
# ============================================

x-app-common: &app-common

  # Imagen canonica publicada en el registry y fijada por digest.
  image: ${APP_IMAGE:?Configura APP_IMAGE con la imagen canonica y su digest}

  pull_policy: always

  environment:
    ASPNETCORE_ENVIRONMENT: Development
    ASPNETCORE_URLS: http://+:8080

    # Base MySQL unica compartida por todo el equipo.
    ConnectionStrings__MySqlConnection: ${MYSQL_CONNECTION:?Configura MYSQL_CONNECTION en .env}

    DataProtection__KeysPath: /app/shared-keys

    # H2: las 3 replicas comparten la misma instancia de Redis
    REDIS_HOST: redis
    REDIS_PORT: 6379
    Redis__ExpiracionDashboardSegundos: 60

    # Correo de verificacion para las 3 replicas
    Email__Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
    Email__Smtp__Port: "${SMTP_PORT:-465}"
    Email__Smtp__Security: ${SMTP_SECURITY:-SslOnConnect}
    Email__Smtp__Username: ${SMTP_USERNAME:-}
    Email__Smtp__Password: ${SMTP_PASSWORD:-}
    Email__Smtp__From: ${SMTP_FROM:-}

    # URL utilizada para generar enlaces de verificacion
    App__PublicBaseUrl: ${APP_PUBLIC_BASE_URL:?Configura APP_PUBLIC_BASE_URL en .env}
    App__PermitirHttpNoSeguro: ${APP_PERMITIR_HTTP_NO_SEGURO:-false}

  volumes:
    - taller-dpkeys:/app/shared-keys

  depends_on:
    redis:
      condition: service_healthy

  restart: unless-stopped

# ============================================
# SERVICIOS
# ============================================

services:

  # ------------------------------------------
  # REDIS - CACHE DISTRIBUIDA (H2)
  # ------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: taller-mecanico-redis

    # Cache volatil: sin persistencia en disco y con limite de memoria.
    command: >
      redis-server
      --save ""
      --appendonly no
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru

    ports:
      - "127.0.0.1:6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

  # ------------------------------------------
  # REPLICA 1
  # ------------------------------------------
  app1:
    <<: *app-common

    ports:
      - "127.0.0.1:5000:8080"

  # ------------------------------------------
  # REPLICA 2
  # ------------------------------------------
  app2:
    <<: *app-common

    ports:
      - "127.0.0.1:5001:8080"

  # ------------------------------------------
  # REPLICA 3
  # ------------------------------------------
  app3:
    <<: *app-common

    ports:
      - "127.0.0.1:5002:8080"

  # ------------------------------------------
  # NGINX - BALANCEADOR HTTP / HTTPS
  # ------------------------------------------
  nginx:
    image: nginx:1.27-alpine

    ports:
      # HTTP principal
      - "${APP_BIND_ADDRESS:-127.0.0.1}:80:80"

      # HTTP alternativo para pruebas
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8088:80"

      # HTTPS
      - "${APP_BIND_ADDRESS:-127.0.0.1}:443:443"

    volumes:
      # Configuracion de Nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

      # Certificados HTTPS locales
      - ./nginx/certs:/etc/nginx/certs:ro

    depends_on:
      - app1
      - app2
      - app3

    restart: unless-stopped

# ============================================
# VOLUMENES PERSISTENTES
# ============================================

volumes:
  taller-dpkeys:

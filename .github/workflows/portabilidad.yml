name: Portabilidad Windows y macOS

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: portabilidad-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Validar lanzadores Bash
        shell: bash
        run: |
          bash -n scripts/entorno.sh
          bash -n taller.sh
          bash ./taller.sh ayuda
          bash ./tests/entorno-portable.sh
      - name: Validar ayuda de MSBuild
        run: dotnet msbuild -t:Ayuda
      - name: Restaurar dependencias
        run: dotnet restore tests/TallerMecanico.IntegrationTests/TallerMecanico.IntegrationTests.csproj
      - name: Compilar
        run: dotnet build tests/TallerMecanico.IntegrationTests/TallerMecanico.IntegrationTests.csproj --configuration Release --no-restore
      - name: Ejecutar pruebas sin servicios externos
        run: dotnet test tests/TallerMecanico.IntegrationTests/TallerMecanico.IntegrationTests.csproj --configuration Release --no-build -- xUnit.ParallelizeTestCollections=false

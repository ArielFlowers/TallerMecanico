name: Servicio Usuarios

# Servicio 2. El esquema lo crea el Servicio 1, por eso tambien vigila su persistencia.
on:
  pull_request:
    paths:
      - 'backend-services/servicio-usuarios/**'
      - 'tests/servicio-usuarios.Tests/**'
      - 'backend-services/servicio-ordenes/Infraestructura/Persistencia/**'
      - '.github/workflows/ci-servicio-usuarios.yml'
      - 'tests/comun/**'
      - 'tests/Comun.props'
      - 'tests/pdf_text.py'
      - 'tests/requirements-ci.txt'
      - 'shared/**'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - 'backend-services/servicio-usuarios/**'
      - 'tests/servicio-usuarios.Tests/**'
      - 'backend-services/servicio-ordenes/Infraestructura/Persistencia/**'
      - '.github/workflows/ci-servicio-usuarios.yml'
      - 'tests/comun/**'
      - 'tests/Comun.props'
      - 'tests/pdf_text.py'
      - 'tests/requirements-ci.txt'
      - 'shared/**'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_test_password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3308:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping -h 127.0.0.1 --protocol=tcp -uroot -pci_test_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=24
    env:
      PROYECTO_PRUEBAS: tests/servicio-usuarios.Tests/servicio-usuarios.Tests.csproj
      TALLER_TEST_MYSQL: 'Server=127.0.0.1;Port=3308;User ID=root;Password=ci_test_password;SslMode=Disabled;'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v6
      - name: Probar la logica y la base de datos
        uses: ./.github/actions/probar-app

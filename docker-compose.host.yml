# ============================================
# PC ANFITRIONA - MYSQL + MAILPIT COMPARTIDOS
# ============================================
# Este compose se ejecuta SOLO en la PC que
# aloja la base de datos y el correo del equipo.
# Plan B historico: no iniciarlo si se usa Aiven.
# MySQL 8.4 usa un volumen nuevo; restaurar antes el dump de la base anterior.
#
# Requisitos:
# - Tailscale activo y con IP 100.x.x.x estable.
# - Firewall permitiendo 3306, 1025 y 8025 solo
#   por la interfaz de Tailscale.
# - Archivo .env con TAILSCALE_IP, passwords y
#   las imagenes fijadas por digest.
#
# Uso:
#   docker compose -f docker-compose.host.yml up -d
# ============================================

services:

  mysql:
    # Fijar por digest en produccion, por ejemplo:
    # mysql:8.4@sha256:<digest>
    image: ${MYSQL_IMAGE:-mysql:8.4}

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taller_mecanico}
      MYSQL_USER: ${MYSQL_USER:-taller}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD en .env}

    command: >
      --log-bin-trust-function-creators=1
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

    ports:
      # Acceso local para la app del anfitrion.
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"

      # Acceso del equipo por Tailscale.
      - "${TAILSCALE_IP:?Configura TAILSCALE_IP en .env}:${MYSQL_TAILSCALE_PORT:-3306}:3306"

    volumes:
      - taller-mysql-data-84:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"
      interval: 10s
      timeout: 5s
      retries: 15

    restart: unless-stopped

  mailpit:
    # Fijar por digest en produccion.
    image: ${MAILPIT_IMAGE:-axllent/mailpit:latest}

    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db

    ports:
      # SMTP local para la app del anfitrion.
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

      # Interfaz web local para revisar los correos.
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

      # SMTP compartido para las replicas de todos los integrantes.
      - "${TAILSCALE_IP:?Configura TAILSCALE_IP en .env}:${MAILPIT_SMTP_PORT:-1025}:1025"

      # Interfaz web compartida para revisar los correos.
      - "${TAILSCALE_IP:?Configura TAILSCALE_IP en .env}:${MAILPIT_UI_PORT:-8025}:8025"

    volumes:
      - taller-mailpit-data:/data

    restart: unless-stopped

volumes:
  taller-mysql-data-84:
  taller-mailpit-data:
